name: Release and deploy

env:
  IMAGE_NAME: nbe95/apigator

on:
  push:
    branches:
      - main

jobs:
  tag-version:
    name: Tag new version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read
    outputs:
      version: ${{ steps.semver.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Get commit data
        id: commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - uses: jefflinse/pr-semver-bump@v1.7.0
        name: Bump and tag new version
        id: semver
        with:
          mode: bump
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          major-label: major
          minor-label: minor
          patch-label: patch
          noop-labels: ""
          require-release-notes: false
          base-branch: true
          with-v: false

  docker-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs:
      - tag-version
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          build-args: |
            VERSION=${{ needs.tag-version.outputs.version }}
            VERSION_SHA=${{ needs.tag-version.outputs.sha }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.tag-version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
